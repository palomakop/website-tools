<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 Videos</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../nav.js"></script>
</head>
<body>
    <website-nav></website-nav>
    <div class="main-container">
        <div class="left-column" id="leftColumn">
            <div class="resize-handle" id="resizeHandle"></div>

            <div class="section-scroll">
                <div class="section">
                    <h2>Video Data or API Key</h2>
                    <textarea id="tsvInput" placeholder="Paste row from video database, or paste API key..." style="height: 120px;"></textarea>
                    <div id="errorMessage" style="display: none; margin-top: 8px; padding: 8px; background: var(--bg-invalid); border: 1px solid var(--color-red-light); border-radius: 3px; font-size: 12px; color: var(--color-red-light);"></div>
                    <button onclick="loadVideoData(event)">Load Video Data</button>
                </div>

                <div class="section" id="databaseSection" style="display: none;">
                    <div id="databaseStatus"></div>
                </div>

                <div class="section">
                    <a href="https://grist.perfectsky.institute/o/docs/bbwBKGd1ZMiH/video-database" target="_blank" rel="noopener" style="display: block; text-align: center; padding: 8px; color: var(--color-blue-light); text-decoration: none; background: var(--bg-primary); border-radius: 3px; border: 1px solid var(--border-secondary); transition: border-color 0.2s; font-size: 12px;" onmouseover="this.style.borderColor='var(--color-blue-light)'" onmouseout="this.style.borderColor='var(--border-secondary)'">Open Video Database ↗</a>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="section">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div class="create-page-controls">
                        <h2 style="margin: 0;">Video Blocks</h2>
                    </div>
                    <button onclick="clearAllData()" class="clear-btn">Clear All Videos</button>
                </div>
            </div>

            <div id="videosContainer" class="blocks-container"></div>
            <div id="emptyState" style="padding: 40px 20px; text-align: center; color: var(--text-secondary);">
                <p>No videos loaded yet.</p>
            </div>
        </div>
    </div>

    <!-- Browse Videos Modal -->
    <div class="modal-overlay" id="browseModal" onclick="if(event.target === this) closeBrowseModal()">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Browse Videos</div>
                <button class="modal-close" onclick="closeBrowseModal()">×</button>
            </div>
            <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                <div id="browseVideosContainer"></div>
            </div>
            <div class="modal-footer">
                <button id="createBlocksBtn" onclick="createSelectedBlocks()" disabled style="opacity: 0.5;">Create Blocks</button>
            </div>
        </div>
    </div>

    <script src="videos.js"></script>
</body>
</html>
